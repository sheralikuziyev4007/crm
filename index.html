<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pipeline CRM — Client management dashboard</title>
    <meta
      name="description"
      content="Pipeline CRM is a SaaS-style client management dashboard: sign-in, analytics, a searchable client table, a Kanban pipeline, client notes and activity history, CSV export, light and dark themes."
    />
    <meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090c1c" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pipeline CRM — Client management dashboard" />
    <meta
      property="og:description"
      content="React 19 + TypeScript CRM demo: dashboard, client table, Kanban pipeline, notes, activity, CSV export."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before the first paint, so there is no white flash
      (function () {
        try {
          var saved = localStorage.getItem("pipeline-theme");
          var system = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = saved === "dark" || ((saved === null || saved === "system") && system);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Pipeline CRM needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
